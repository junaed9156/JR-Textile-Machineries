name: Static website security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static security boundaries
        run: python3 scripts/check-security.py
      - name: Check JavaScript syntax and security regression cases
        run: |
          node --check assets/theme.js
          node --check assets/i18n.js
          node --check assets/security.js
          node --check assets/app.js
          node --test tests/security.test.cjs
      - name: Install checksum-verified secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan current source for leaked secrets
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner'
